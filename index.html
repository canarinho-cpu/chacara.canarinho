<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://lh3.googleusercontent.com https://nominatim.openstreetmap.org; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chácara Canarinho</title>
  <meta name="description" content="Reserve a sua cabana na Chácara Canarinho: dias disponíveis, fotos e atendimento pelo chat.">
  <meta name="theme-color" content="#d99a00">
  <link rel="manifest" href="manifest.webmanifest?v=1794513943">
  <link rel="icon" href="icons/icon-192.png?v=1794513943" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1794513943">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Canarinho">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tema.js"></script>
  <script src="js/vendor/supabase.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img id="brand-logo" src="icons/icon-192.png" alt="" width="32" height="32">
      <span id="app-name">Chácara Canarinho</span>
    </a>
    <div class="top-actions">
      <button type="button" id="theme-btn" class="top-icon theme-btn" aria-label="Trocar tema claro ou escuro"></button>
      <a href="#/entrar" id="account-link" class="account-link" hidden>Entrar</a>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading">Carregando…</div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal" hidden></nav>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
