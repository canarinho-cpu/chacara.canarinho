      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#f7b500"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c21b"/>
      <stop offset="1" stop-color="#e09a00"/>
